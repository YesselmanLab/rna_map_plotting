[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yplot"
version = "0.2.0"
description = "Common plotting tools to analyze DMS-MaPseq data"
readme = "README.md"
authors = [
    {name = "Joe Yesselman", email = "jyesselm@unl.edu"}
]
requires-python = ">=3.9"
classifiers = [
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: PyPy",
]
keywords = ["yplot", "plotting", "DMS-MaPseq", "visualization"]
dependencies = [
    "matplotlib>=3.5",
    "numpy>=1.20",
    "pandas>=1.3",
    "pyyaml>=6.0",
    "scikit-learn>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/jyesselm/rna_map_plotting"
Repository = "https://github.com/jyesselm/rna_map_plotting"

[tool.setuptools.packages.find]
where = ["."]
include = ["yplot*"]

[tool.setuptools.package-data]
yplot = ["**/*"]

[tool.ruff]
target-version = "py39"
line-length = 88
exclude = ["build", "dist", ".git", "__pycache__", "*.egg-info"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "C90",    # mccabe complexity
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["yplot"]

[tool.mypy]
python_version = "3.9"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["build", "dist", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "--cov=yplot",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=90",
    "-v",
]

[tool.coverage.run]
source = ["yplot"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

